<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>OT Sign-Up Sheet</title>
<style>
  :root {
    --bg: #0A0B0F; --card: #15171D; --border: #22242B; --text: #F5F3ED;
    --muted: #8A8E98; --accent: #E3B15E;
    --day-color: #F5A623; --afternoon-color: #5C7CFA; --midnight-color: #8B5CF6; --vacation-color: #B565E8;
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #F5F4F1; --card: #FFFFFF; --border: #DDDAD2;
      --text: #1A1A1A; --muted: #6B6B6B; --accent: #B8791E;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 28px 18px 60px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { font-size: 13px; color: var(--muted); margin-bottom: 22px; }
  .controls {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; margin-bottom: 24px;
  }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 6px; }
  select, input[type="date"], input[type="text"], textarea {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px; font-size: 15px; font-family: inherit;
  }
  textarea { resize: vertical; }
  .gen-btn {
    width: 100%; background: var(--accent); color: #15171D; border: none; border-radius: 8px;
    padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 6px;
  }
  .mode-row { display: flex; gap: 8px; margin-bottom: 16px; }
  .mode-btn {
    flex: 1; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--muted); padding: 10px 8px; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  .mode-btn.active { color: #15171D; }
  #mode-vacation-btn.active { background: var(--vacation-color); border-color: var(--vacation-color); }
  #mode-midnight-btn.active { background: var(--midnight-color); border-color: var(--midnight-color); }
  .days-row { display: flex; gap: 10px; align-items: flex-end; }
  .days-row .field { flex: 1; margin-bottom: 0; }
  .days-row input[type="number"] {
    width: 100%; background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px; font-size: 15px; font-family: inherit;
  }
  .print-btn {
    width: 100%; background: transparent; color: var(--text); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px; font-size: 14px; font-weight: 600; cursor: pointer; margin-top: 8px;
  }
  #sheet { display: none; }
  #sheet.show { display: block; }
  .sheet-card {
    background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px 22px;
  }
  .sheet-card, .sheet-card * { font-family: 'Avenir Next', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
  .sheet-title { font-size: 24px; font-weight: 800; margin: 0 0 4px; }
  .sheet-header { margin-bottom: 24px; }
  .sheet-vacancy { font-size: 20px; text-align: center; font-weight: 700; margin: 6px 0 0; }
  .sheet-reason-display { font-size: 14px; color: var(--muted); text-align: center; margin: 8px 0 0; white-space: pre-wrap; }
  .day-block { margin-bottom: 22px; }
  .sign-line { border-top: 2px solid var(--border); height: 28px; margin-bottom: 8px; }
  .day-name { font-weight: 800; font-size: 19px; }
  .day-status { font-size: 15px; font-weight: 700; color: var(--muted); margin-top: 3px; }
  .day-status.off { font-weight: 800; color: var(--text); }
  .priority-row { display: flex; justify-content: space-between; margin-top: 6px; font-size: 17px; }
  .priority-row span { font-weight: 800; }

  @media print {
    body { background: #fff; color: #000; }
    .controls, .print-btn, h1, .sub { display: none !important; }
    .wrap { max-width: 100%; padding: 0; }
    .sheet-card { border: none; padding: 0; }
    .sign-line { border-top: 1.5px solid #000; }
    .day-status.off { color: #000; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>OT Sign-Up Sheet</h1>
  <div class="sub">Choose a sheet type, fill in the details, then generate.</div>

  <div class="controls">
    <div class="mode-row">
      <button class="mode-btn active" id="mode-vacation-btn">Vacation coverage</button>
      <button class="mode-btn" id="mode-midnight-btn">Midnight overtime</button>
    </div>

    <div id="vacation-fields">
      <div class="field">
        <label for="vacancy-select">Vacancy</label>
        <select id="vacancy-select"></select>
      </div>
      <div class="field">
        <label for="week-date">Week of (any day in the week works)</label>
        <input type="date" id="week-date" />
      </div>
    </div>

    <div id="midnight-fields" style="display:none;">
      <div class="days-row">
        <div class="field">
          <label for="midnight-start">Start date</label>
          <input type="date" id="midnight-start" />
        </div>
        <div class="field" style="max-width:110px;">
          <label for="midnight-days">Days</label>
          <input type="number" id="midnight-days" value="7" min="1" max="60" />
        </div>
      </div>
    </div>

    <div class="field">
      <label for="sheet-reason">Reason / notes (optional)</label>
      <textarea id="sheet-reason" rows="2" placeholder="e.g. Equipment down on Line 3"></textarea>
    </div>

    <button class="gen-btn" id="generate-btn">Generate sheet</button>
  </div>

  <div class="controls">
    <div class="sub" style="margin-bottom:12px;">Who's up first in each group — this is independent of the vacancy and can be changed anytime.</div>
    <div class="field" id="order-cj"></div>
    <div class="field" id="order-ab"></div>
    <div class="field" id="order-bj"></div>
  </div>

  <div class="controls">
    <button class="print-btn" id="edit-names-btn" style="margin-top:0;">Edit names</button>
    <div id="names-form" style="display:none;margin-top:14px;">
      <div class="field" id="names-cj"></div>
      <div class="field" id="names-ab"></div>
      <div class="field" id="names-bj"></div>
      <button class="gen-btn" id="names-save-btn">Save names</button>
    </div>
  </div>

  <div id="sheet">
    <div class="sheet-card" id="sheet-content"></div>
    <button class="gen-btn" id="html-btn" style="margin-top:10px;">Open as HTML page</button>
  </div>
</div>

<script>
(function () {
  // ---- Same rotation rules as the calendar, duplicated here deliberately (kept fully standalone) ----
  var CYCLE_LEN = 21;
  var CYCLE_SEGMENTS = [
    { len: 8, type: 'day' },
    { len: 4, type: 'off' },
    { len: 7, type: 'afternoon' },
    { len: 2, type: 'off' },
  ];
  var CREWS = [
    { id: 'cj', label: 'Chris/CJ', anchor: new Date(2026, 6, 31), members: [{ id: 'cj_chris', name: 'Chris' }, { id: 'cj_cj', name: 'CJ' }] },
    { id: 'ab', label: 'Allen/Brad', anchor: new Date(2026, 7, 7), members: [{ id: 'ab_allen', name: 'Allen' }, { id: 'ab_brad', name: 'Brad' }] },
    { id: 'bj', label: 'Bill/Justin', anchor: new Date(2026, 6, 24), members: [{ id: 'bj_bill', name: 'Bill' }, { id: 'bj_justin', name: 'Justin' }] },
  ];

  function daysBetween(a, b) {
    var ms = 24 * 60 * 60 * 1000;
    var ua = Date.UTC(a.getFullYear(), a.getMonth(), a.getDate());
    var ub = Date.UTC(b.getFullYear(), b.getMonth(), b.getDate());
    return Math.round((ub - ua) / ms);
  }
  function cycleIndex(crew, date) {
    var idx = daysBetween(crew.anchor, date) % CYCLE_LEN;
    if (idx < 0) idx += CYCLE_LEN;
    return idx;
  }
  function shiftFor(crew, date) {
    var idx = cycleIndex(crew, date);
    var acc = 0;
    for (var i = 0; i < CYCLE_SEGMENTS.length; i++) {
      if (idx < acc + CYCLE_SEGMENTS[i].len) return CYCLE_SEGMENTS[i].type;
      acc += CYCLE_SEGMENTS[i].len;
    }
    return 'off';
  }
  function escapeHtml(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function crewOfPerson(personId) {
    for (var i = 0; i < CREWS.length; i++) {
      if (CREWS[i].members.some(function (m) { return m.id === personId; })) return CREWS[i];
    }
    return null;
  }

  // ---- Editable names (in case someone leaves/changes jobs) ----
  try {
    var savedNames = JSON.parse(localStorage.getItem('ot_signup_names') || '{}');
    CREWS.forEach(function (c) {
      c.members.forEach(function (m) { if (savedNames[m.id]) m.name = savedNames[m.id]; });
    });
  } catch (e) {}
  function saveNames() {
    var out = {};
    CREWS.forEach(function (c) { c.members.forEach(function (m) { out[m.id] = m.name; }); });
    try {
      localStorage.setItem('ot_signup_names', JSON.stringify(out));
      return true;
    } catch (e) {
      return false;
    }
  }
  function renderVacancyOptions() {
    var sel = document.getElementById('vacancy-select');
    var prev = sel.value;
    var html = '';
    CREWS.forEach(function (c) {
      c.members.forEach(function (m) { html += '<option value="' + m.id + '">' + m.name + '</option>'; });
    });
    sel.innerHTML = html;
    if (prev && CREWS.some(function (c) { return c.members.some(function (m) { return m.id === prev; }); })) sel.value = prev;
  }
  function renderNamesForm() {
    CREWS.forEach(function (c) {
      var el = document.getElementById('names-' + c.id);
      var html = '<label>' + c.label + '</label><div style="display:flex;gap:8px;">';
      c.members.forEach(function (m) {
        html += '<input type="text" data-person="' + m.id + '" value="' + m.name.replace(/"/g, '&quot;') + '">';
      });
      html += '</div>';
      el.innerHTML = html;
    });
  }
  renderNamesForm();
  document.getElementById('edit-names-btn').addEventListener('click', function () {
    var form = document.getElementById('names-form');
    form.style.display = form.style.display === 'none' ? 'block' : 'none';
  });
  document.getElementById('names-save-btn').addEventListener('click', function () {
    document.querySelectorAll('[data-person]').forEach(function (input) {
      var id = input.getAttribute('data-person');
      var newName = input.value.trim();
      if (!newName) return;
      CREWS.forEach(function (c) {
        c.members.forEach(function (m) { if (m.id === id) m.name = newName; });
      });
    });
    var saveOk = saveNames();
    renderVacancyOptions();
    renderOrderControls();
    document.getElementById('names-form').style.display = 'none';
    if (saveOk) {
      var btn = document.getElementById('names-save-btn');
      var original = btn.textContent;
      btn.textContent = 'Saved \u2014 will stay like this';
      setTimeout(function () { btn.textContent = original; }, 2000);
    } else {
      alert('Couldn\u2019t save these names on this device (your browser may be blocking storage, e.g. Private Browsing). The change will only last until you leave this page.');
    }
  });

  // ---- Who's up first within each pair (separate from the vacancy, changeable anytime) ----
  var firstPerson = {};
  try {
    var saved = JSON.parse(localStorage.getItem('ot_signup_first_person') || '{}');
    CREWS.forEach(function (c) { firstPerson[c.id] = saved[c.id] || c.members[0].id; });
  } catch (e) {
    CREWS.forEach(function (c) { firstPerson[c.id] = c.members[0].id; });
  }
  function saveFirstPerson() {
    try { localStorage.setItem('ot_signup_first_person', JSON.stringify(firstPerson)); } catch (e) {}
  }
  function orderedNames(crew) {
    var first = firstPerson[crew.id];
    var ms = crew.members.slice().sort(function (a, b) { return (a.id === first ? -1 : 0) - (b.id === first ? -1 : 0); });
    return ms.map(function (m) { return m.name; }).join(' / ');
  }
  function renderOrderControls() {
    CREWS.forEach(function (c) {
      var el = document.getElementById('order-' + c.id);
      var html = '<label>' + c.label + ' — up first</label><select data-crew="' + c.id + '">';
      c.members.forEach(function (m) {
        html += '<option value="' + m.id + '"' + (firstPerson[c.id] === m.id ? ' selected' : '') + '>' + m.name + '</option>';
      });
      html += '</select>';
      el.innerHTML = html;
    });
    document.querySelectorAll('[data-crew]').forEach(function (sel) {
      sel.addEventListener('change', function () {
        firstPerson[sel.getAttribute('data-crew')] = sel.value;
        saveFirstPerson();
      });
    });
  }
  renderOrderControls();
  renderVacancyOptions();
  function mondayOf(date) {
    var d = new Date(date);
    var day = d.getDay(); // 0 Sun .. 6 Sat
    var diff = day === 0 ? -6 : 1 - day;
    d.setDate(d.getDate() + diff);
    return d;
  }

  var DOW_NAMES = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

  function ordinalDate(d) {
    var day = d.getDate();
    var suf = 'th';
    if (day % 10 === 1 && day !== 11) suf = 'st';
    else if (day % 10 === 2 && day !== 12) suf = 'nd';
    else if (day % 10 === 3 && day !== 13) suf = 'rd';
    return d.toLocaleDateString(undefined, { month: 'long' }) + ' ' + day + suf;
  }

  function computeSheetData(vacancyPersonId, anyDateInWeek) {
    var vacancyCrew = crewOfPerson(vacancyPersonId);
    var vacancyPerson = vacancyCrew.members.find(function (m) { return m.id === vacancyPersonId; });
    var monday = mondayOf(anyDateInWeek);
    var days = [];

    for (var i = 0; i < 7; i++) {
      var d = new Date(monday);
      d.setDate(d.getDate() + i);
      var vacShift = shiftFor(vacancyCrew, d);
      var day = { dayName: DOW_NAMES[d.getDay()], off: vacShift !== 'day' && vacShift !== 'afternoon' };
      if (!day.off) {
        day.label = vacShift === 'day' ? 'Days' : 'Afternoons';
        var others = CREWS.filter(function (c) { return c.id !== vacancyCrew.id; });
        var offCrew = null, workingCrew = null;
        others.forEach(function (c) {
          var s = shiftFor(c, d);
          if (s === 'off') offCrew = c; else workingCrew = c;
        });
        if (!offCrew && vacShift === 'day') {
          // Once per 21-day cycle, two crews overlap on day shift (one finishing their
          // 8-day block as the other starts theirs). If the VACANCY itself is the day
          // shift, it's already naturally double covered by that overlap, so there's no
          // secondary group to list.
          day.groups = ['Double covered'];
        } else if (!offCrew) {
          // Afternoon vacancy landing on that same overlap Friday: neither other crew is
          // off (both are on day), so order them by who's closer to finishing their 8-day
          // block and going into their 4-day break \u2014 they get first priority.
          var idxA = cycleIndex(others[0], d), idxB = cycleIndex(others[1], d);
          var firstCrew = idxA >= idxB ? others[0] : others[1];
          var secondCrew = idxA >= idxB ? others[1] : others[0];
          day.groups = [orderedNames(firstCrew), orderedNames(secondCrew)];
        } else {
          day.groups = [orderedNames(offCrew)];
          if (workingCrew) day.groups.push(orderedNames(workingCrew));
        }
      }
      days.push(day);
    }
    return { mode: 'vacation', weekLabel: ordinalDate(monday), vacancyName: vacancyPerson.name, days: days };
  }

  // ---- Midnight overtime: open to all 3 crews every day, ranked off-crew first, then
  // whoever's on afternoons, then whoever's on days. Covers an arbitrary date range
  // (start date + a number of days), not necessarily aligned to a Mon\u2013Sun week.
  function tierFor(shiftType) {
    if (shiftType === 'off') return 0;
    if (shiftType === 'afternoon') return 1;
    return 2; // 'day'
  }
  function computeMidnightSheetData(startDateStr, numDays) {
    var start = new Date(startDateStr + 'T00:00:00');
    var n = Math.max(1, Math.min(60, parseInt(numDays, 10) || 7));
    var days = [];

    for (var i = 0; i < n; i++) {
      var d = new Date(start);
      d.setDate(d.getDate() + i);
      var ranked = CREWS.map(function (c) {
        return { crew: c, tier: tierFor(shiftFor(c, d)), idx: cycleIndex(c, d) };
      });
      // Within the same tier, whoever's closer to finishing their current segment (and
      // so closer to their next break) gets listed first \u2014 same convention used for
      // the day-shift overlap case on vacation coverage sheets.
      ranked.sort(function (a, b) {
        if (a.tier !== b.tier) return a.tier - b.tier;
        return b.idx - a.idx;
      });
      days.push({
        dayName: DOW_NAMES[d.getDay()],
        dateLabel: d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }),
        off: false,
        label: 'Midnight',
        groups: ranked.map(function (r) { return orderedNames(r.crew); }),
      });
    }
    var end = new Date(start);
    end.setDate(end.getDate() + n - 1);
    return {
      mode: 'midnight',
      weekLabel: ordinalDate(start) + (n > 1 ? ' \u2013 ' + ordinalDate(end) : ''),
      days: days,
    };
  }

  function renderSheetHtml(data) {
    var html = '';
    html += '<div class="sheet-header">';
    if (data.mode === 'midnight') {
      html += '<div class="sheet-title">Midnight Overtime</div>';
      html += '<div class="sheet-vacancy" style="color:var(--midnight-color);">' + data.weekLabel + '</div>';
    } else {
      html += '<div class="sheet-title">Overtime Week of ' + data.weekLabel + '</div>';
      html += '<div class="sheet-vacancy" style="color:var(--vacation-color);">Vacancy &ndash; ' + data.vacancyName + '</div>';
    }
    if (data.reason) {
      html += '<div class="sheet-reason-display">' + escapeHtml(data.reason) + '</div>';
    }
    html += '</div>';
    data.days.forEach(function (day) {
      html += '<div class="day-block"><div class="sign-line"></div>';
      html += '<div class="day-name">' + day.dayName + (day.dateLabel ? ' <span style="font-weight:500;">(' + day.dateLabel + ')</span>' : '') + '</div>';
      if (day.off) {
        html += '<div class="day-status off">Off</div>';
      } else {
        var labelColor = day.label === 'Days' ? 'var(--day-color)' : day.label === 'Afternoons' ? 'var(--afternoon-color)' : 'var(--midnight-color)';
        html += '<div class="day-status" style="color:' + labelColor + ';">' + day.label + '</div>';
        html += '<div class="priority-row">';
        day.groups.forEach(function (name, i) {
          var align = (i === 0) ? 'left' : (i === day.groups.length - 1 ? 'right' : 'center');
          html += '<span style="text-align:' + align + ';">' + name + '</span>';
        });
        html += '</div>';
      }
      html += '</div>';
    });
    return html;
  }

  function buildPlainHtml(data) {
    var rows = '';
    data.days.forEach(function (day) {
      rows += '<div class="d-bar"></div>';
      rows += '<div class="d-row">';
      rows += '<div class="d-name">' + day.dayName + (day.dateLabel ? ' (' + day.dateLabel + ')' : '') + '</div>';
      if (day.off) {
        rows += '<div class="d-status">Off</div>';
      } else {
        rows += '<div class="d-status">' + day.label + '</div>';
        rows += '<div class="d-names">';
        day.groups.forEach(function (name, i) {
          var align = (i === 0) ? 'left' : (i === day.groups.length - 1 ? 'right' : 'center');
          rows += '<span style="text-align:' + align + ';">' + name + '</span>';
        });
        rows += '</div>';
      }
      rows += '</div>';
    });

    var style = '' +
      '*{box-sizing:border-box;}' +
      'body{margin:0;background:#fff;color:#000;font-family:\'Avenir Next\',\'Helvetica Neue\',Helvetica,Arial,sans-serif;' +
      'padding:32px 20px 60px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}' +
      '.wrap{max-width:680px;margin:0 auto;}' +
      '.header{font-size:24px;font-weight:800;margin:0 0 6px;}' +
      '.vac{font-size:20px;font-weight:700;text-align:center;margin:0;}' +
      '.reason{font-size:15px;color:#555;text-align:center;margin:8px 0 0;white-space:pre-wrap;}' +
      '.header-wrap{margin-bottom:26px;}' +
      '.d-bar{background:#999;height:16px;margin-bottom:8px;}' +
      '.d-row{margin-bottom:22px;}' +
      '.d-name{font-size:20px;font-weight:800;margin-bottom:3px;}' +
      '.d-status{font-size:16px;font-weight:700;margin-bottom:6px;}' +
      '.d-names{display:flex;justify-content:space-between;font-size:18px;font-weight:800;max-width:580px;}' +
      '.print-bar{max-width:680px;margin:0 auto 18px;text-align:right;}' +
      '.print-btn{background:#333;color:#fff;border:none;border-radius:6px;padding:8px 16px;' +
      'font-size:13px;font-weight:600;cursor:pointer;}' +
      '@media print{' +
      '@page{size:auto;margin:0.35in;}' +
      '.print-bar{display:none;}' +
      'body{padding:0;}' +
      '.header-wrap{margin-bottom:12px;}' +
      '.header{font-size:17px;margin-bottom:2px;}' +
      '.vac{font-size:14px;}' +
      '.reason{font-size:12px;margin-top:4px;}' +
      '.d-bar{height:9px;margin-bottom:3px;}' +
      '.d-row{margin-bottom:8px;}' +
      '.d-name{font-size:13px;margin-bottom:1px;}' +
      '.d-status{font-size:11px;margin-bottom:1px;}' +
      '.d-names{font-size:12px;max-width:420px;}' +
      '}';

    var headerHtml = data.mode === 'midnight'
      ? '<div class="header">Midnight Overtime</div><div class="vac">' + data.weekLabel + '</div>'
      : '<div class="header">Overtime Week of ' + data.weekLabel + '</div><div class="vac">Vacancy - ' + data.vacancyName + '</div>';
    if (data.reason) {
      headerHtml += '<div class="reason">' + escapeHtml(data.reason) + '</div>';
    }
    headerHtml = '<div class="header-wrap">' + headerHtml + '</div>';

    var body = '' +
      '<div class="print-bar"><button class="print-btn" onclick="window.print()">Print</button></div>' +
      '<div class="wrap">' + headerHtml + rows + '</div>';

    return '<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>OT Sign-Up \u2014 ' + data.weekLabel + '</title><style>' + style + '</style></head>' +
      '<body>' + body + '</body></html>';
  }

  var today = new Date();
  var todayStr = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
  document.getElementById('week-date').value = todayStr;
  document.getElementById('midnight-start').value = todayStr;

  var sheetMode = 'vacation';
  function setMode(mode) {
    sheetMode = mode;
    document.getElementById('mode-vacation-btn').classList.toggle('active', mode === 'vacation');
    document.getElementById('mode-midnight-btn').classList.toggle('active', mode === 'midnight');
    document.getElementById('vacation-fields').style.display = mode === 'vacation' ? 'block' : 'none';
    document.getElementById('midnight-fields').style.display = mode === 'midnight' ? 'block' : 'none';
    document.getElementById('generate-btn').style.background = mode === 'vacation' ? 'var(--vacation-color)' : 'var(--midnight-color)';
  }
  document.getElementById('mode-vacation-btn').addEventListener('click', function () { setMode('vacation'); });
  document.getElementById('mode-midnight-btn').addEventListener('click', function () { setMode('midnight'); });
  setMode('vacation');

  var lastSheetData = null;

  document.getElementById('generate-btn').addEventListener('click', function () {
    if (sheetMode === 'vacation') {
      var personId = document.getElementById('vacancy-select').value;
      var dateVal = document.getElementById('week-date').value;
      if (!dateVal) return;
      var d = new Date(dateVal + 'T00:00:00');
      lastSheetData = computeSheetData(personId, d);
    } else {
      var startVal = document.getElementById('midnight-start').value;
      var daysVal = document.getElementById('midnight-days').value;
      if (!startVal) return;
      lastSheetData = computeMidnightSheetData(startVal, daysVal);
    }
    lastSheetData.reason = document.getElementById('sheet-reason').value.trim();
    document.getElementById('sheet-content').innerHTML = renderSheetHtml(lastSheetData);
    document.getElementById('sheet').classList.add('show');
  });

  document.getElementById('html-btn').addEventListener('click', function () {
    if (!lastSheetData) return;
    var htmlStr = buildPlainHtml(lastSheetData);
    var blob = new Blob([htmlStr], { type: 'text/html' });
    var url = URL.createObjectURL(blob);
    var win = window.open(url, '_blank');
    if (!win) {
      // popup blocked — fall back to navigating this tab there
      window.location.href = url;
    }
    setTimeout(function () { URL.revokeObjectURL(url); }, 10000);
  });
})();
</script>
</body>
</html>
